<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translation Test</title>
</head>
<body>
    <!-- These should be detected (not translated) -->
    <h1>Welcome to our website</h1>
    <p>This is a sample paragraph with text that should be extracted.</p>
    <button>Submit Form</button>
    <input type="text" placeholder="Enter your name here" />
    
    <!-- These should be SKIPPED (already translated) -->
    <h2>{{ $t('already.translated.title') }}</h2>
    <p>{{ $t('existing.translation.text') }}</p>
    <button v-text="$t('submit.button')"></button>
    <input type="text" :placeholder="$t('name.placeholder')" />
    <div>{$t('another.key')}</div>
    
    <!-- Mixed content -->
    <div>
        <span>This should be detected</span>
        <span>{{ $t('this.should.be.skipped') }}</span>
        <span>This should also be detected</span>
    </div>
    
    <script>
        // These should be detected (not translated)
        const message = "This is a JavaScript string";
        const greeting = 'Hello from JavaScript!';
        console.log("This should also be detected");
        alert("Welcome message");
        
        // These should be SKIPPED (already translated)
        const translatedMessage = $t('js.translated.message');
        const anotherTranslated = t('another.translated.text');
        console.log($t('console.translated.log'));
        alert(i18n.t('alert.translated.message'));
        const vueTemplate = `{{ $t('template.translated.key') }}`;
        
        // These should be ignored (code-like)
        const apiUrl = "http://localhost:3000";
        const userId = "user123";
        import './styles.css';
    </script>
</body>
</html>
